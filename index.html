<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六爻算卦 - 周易占卜</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', 'Source Han Serif SC', serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
  line-height: 1.75;
  background-image:
    radial-gradient(ellipse at 15% 40%, rgba(100,50,20,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 15%, rgba(60,40,80,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 85%, rgba(120,80,30,0.03) 0%, transparent 50%);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #161b22; }
::-webkit-scrollbar-thumb { background: #21262d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #8b949e; }

/* ===== LAYOUT ===== */
.app-wrapper {
  display: flex;
  min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: #0d1117;
  border-right: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
  transition: transform 0.3s ease;
  z-index: 100;
}
.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid #30363d;
  text-align: center;
}
.sidebar-header h2 {
  font-size: 0.85rem;
  color: #f78166;
  letter-spacing: 3px;
  font-weight: 500;
  text-transform: uppercase;
}
.sidebar-header p {
  font-size: 0.7rem;
  color: #8b949e;
  margin-top: 2px;
  letter-spacing: 1px;
}
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 4px;
  border: 1px solid transparent;
}
.sidebar-item:hover {
  background: #1c2128;
  border-color: #21262d;
}
.sidebar-item.active {
  background: #1c2128;
  border-color: #8b949e;
}
.sidebar-item .si-gua {
  font-weight: 600;
  color: #f78166;
  font-size: 0.9rem;
  letter-spacing: 0.5px;
}
.sidebar-item .si-keyword {
  font-size: 0.75rem;
  color: #8b949e;
  margin-left: 6px;
}
.sidebar-item .si-time {
  font-size: 0.65rem;
  color: #6e7681;
  display: block;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.sidebar-item .si-badge {
  display: inline-block;
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: 8px;
  margin-left: 4px;
  vertical-align: middle;
}
.sidebar-item .si-badge.has-change {
  background: rgba(192,57,43,0.15);
  color: #f78166;
}
.sidebar-item .si-badge.no-change {
  background: #1c2128;
  color: #8b949e;
}
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid #30363d;
}
.sidebar-clear-btn {
  width: 100%;
  padding: 5px;
  background: transparent;
  border: 1px solid #30363d;
  border-radius: 3px;
  font-family: inherit;
  font-size: 0.7rem;
  color: #6e7681;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.sidebar-clear-btn:hover {
  background: #161b22;
  color: #f78166;
  border-color: #4a1a10;
}
.empty-history {
  text-align: center;
  padding: 40px 16px;
  color: #6e7681;
  font-size: 0.85rem;
}
.empty-history .empty-icon { font-size: 2rem; display: block; margin-bottom: 8px; }

/* Sidebar collapse button (inside header) */
.sidebar-collapse-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: 1px solid #21262d;
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 0.8rem;
  cursor: pointer;
  color: #8b949e;
  transition: all 0.2s;
  line-height: 1.2;
}
.sidebar-collapse-btn:hover {
  background: #1c2128;
  color: #f78166;
}
.sidebar-header {
  position: relative;
}

/* Sidebar toggle button (hamburger, shown when collapsed) */
.sidebar-toggle {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  background: transparent;
  border: 1px solid #30363d;
  border-radius: 6px;
  width: 36px;
  height: 36px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: none;
  color: #6e7681;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.sidebar-toggle:hover {
  background: #161b22;
  border-color: #6e7681;
  color: #e6edf3;
}
.sidebar.open ~ .sidebar-toggle { display: none; }

/* Overlay for mobile */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 90;
}
.sidebar-overlay.active { display: block; }

/* Main content area */
.main-content {
  flex: 1;
  min-width: 0;
  max-width: 880px;
  margin: 0 auto;
  padding: 20px 24px 60px;
  transition: padding 0.3s ease;
}
.sidebar:not(.open) ~ .main-content {
  padding-left: 60px;
}

/* Responsive sidebar */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 100;
  transform: translateX(-100%);
  width: 280px;
  flex-shrink: 0;
  background: #0d1117;
  border-right: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: transform 0.3s ease;
}
.sidebar.open { transform: translateX(0); }

@media (min-width: 769px) {
  .sidebar {
    position: sticky;
    transform: translateX(0);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar:not(.open) {
    transform: translateX(-100%);
    position: fixed;
  }
  .sidebar:not(.open) ~ .main-content {
    padding-left: 60px;
  }
  .sidebar.open ~ .sidebar-toggle { display: none; }
}

@media (max-width: 768px) {
  .sidebar:not(.open) { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { padding: 20px 16px 60px; padding-top: 60px; }
  .sidebar:not(.open) ~ .main-content { padding-left: 16px; padding-top: 60px; }
}

/* ===== HEADER ===== */
.header {
  text-align: center;
  padding: 40px 0 24px;
  position: relative;
}
.header::after {
  content: '';
  display: block;
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #f78166, transparent);
  margin: 20px auto 0;
}
.header-icon {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  margin-bottom: 4px;
  filter: drop-shadow(0 0 8px rgba(201,169,110,0.15));
}
.header-icon .tri-top,
.header-icon .tri-bot {
  font-size: 2.2rem;
  display: block;
  line-height: 1;
  letter-spacing: 0;
}
.header h1 {
  font-size: 1.6rem;
  font-weight: 500;
  color: #f78166;
  letter-spacing: 8px;
  text-shadow: 0 0 30px rgba(201,169,110,0.06);
}
.header .subtitle {
  font-size: 0.85rem;
  color: #8b949e;
  margin-top: 6px;
  letter-spacing: 3px;
  font-style: normal;
}

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin: 28px 0 20px;
  flex-wrap: wrap;
}
.btn {
  font-family: inherit;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 1.05rem;
  letter-spacing: 2px;
  border-radius: 8px;
}
.btn-cast {
  background: linear-gradient(135deg, #21262d, #da3633);
  color: #f0f6fc;
  padding: 12px 28px;
  font-size: 0.95rem;
  letter-spacing: 4px;
  box-shadow: 0 0 20px rgba(218,54,51,0.12), 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden;
  border: none;
  transition: all 0.3s ease;
}
.btn-cast::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%);
  pointer-events: none;
}
.btn-cast:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 30px rgba(218,54,51,0.2), 0 6px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  color: #ffffff;
}
.btn-cast:active {
  transform: translateY(0);
  box-shadow: 0 0 12px rgba(218,54,51,0.08), 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.03);
}
.btn-cast:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-settings-toggle {
  background: transparent;
  color: #8b949e;
  padding: 10px 18px;
  border: 1px solid #30363d;
  font-size: 0.8rem;
  letter-spacing: 1px;
}
.btn-settings-toggle:hover {
  background: #161b22;
  border-color: #6e7681;
  color: #e6edf3;
}

.btn-theme-toggle {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 200;
  background: transparent;
  color: #6e7681;
  width: 36px;
  height: 36px;
  border: 1px solid #30363d;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  border-radius: 6px;
  font-family: inherit;
  cursor: pointer;
  line-height: 1;
}
.btn-theme-toggle:hover {
  background: #161b22;
  border-color: #6e7681;
  color: #e6edf3;
}

[data-theme="light"] .btn-theme-toggle {
  border-color: #d0c8b8;
  color: #8a7a6a;
  background: rgba(255,255,255,0.6);
}
[data-theme="light"] .btn-theme-toggle:hover {
  background: #ede8e0;
  border-color: #b8a890;
  color: #5a3a2a;
}

/* ===== SETTINGS PANEL ===== */
.settings-panel {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: all 0.35s ease;
  margin-bottom: 0;
}
.settings-panel.open {
  padding: 18px 20px 20px;
  max-height: 500px;
  margin-bottom: 20px;
}
.settings-panel h3 {
  font-size: 0.85rem;
  color: #f78166;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 2px;
  font-weight: 500;
}
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 600px) {
  .settings-grid { grid-template-columns: 1fr; }
}
.settings-grid label {
  font-size: 0.85rem;
  color: #8b949e;
  display: block;
  margin-bottom: 4px;
}
.settings-grid input, .settings-grid select {
  font-family: inherit;
  width: 100%;
  padding: 7px 10px;
  border: 1px solid #30363d;
  border-radius: 4px;
  background: #0d1117;
  font-size: 0.85rem;
  color: #e6edf3;
  transition: border-color 0.2s;
}
.settings-grid input:focus, .settings-grid select:focus {
  outline: none;
  border-color: #da3633;
  box-shadow: 0 0 0 1px rgba(122,32,21,0.2);
}
.settings-grid input::placeholder { color: #30363d; }

/* ===== ANIMATION: COIN TOSSING ===== */
.toss-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
.toss-overlay.active { display: flex; }
.toss-animation {
  text-align: center;
  animation: fadeInUp 0.3s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.coin-spinner {
  font-size: 4rem;
  animation: coinFlip 0.6s ease-in-out infinite alternate;
  display: inline-block;
  filter: drop-shadow(0 0 15px rgba(201,169,110,0.2));
}
@keyframes coinFlip {
  0% { transform: rotateY(0deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.1); }
  100% { transform: rotateY(360deg) scale(1); }
}
.toss-text {
  color: #c9b8a5;
  font-size: 1.3rem;
  margin-top: 20px;
  letter-spacing: 3px;
}

/* ===== RESULT CARD ===== */
.result-card {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s ease;
}
.result-card.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ===== HEXAGRAM SECTION ===== */
.hexagram-columns {
  display: flex;
  gap: 20px;
  align-items: stretch;
  margin-bottom: 16px;
}
.hexagram-column {
  flex: 1;
  min-width: 0;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 24px 20px;
  box-shadow: 0 1px 20px rgba(0,0,0,0.3);
}
.hexagram-column--enter {
  opacity: 0;
  transform: translateX(30px) scale(0.97);
  transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.hexagram-column--show {
  opacity: 1;
  transform: translateX(0) scale(1);
}
.hexagram-column--single {
  max-width: 600px;
  margin: 0 auto;
}

/* Changing yao morph animation */
@keyframes yaoMorph {
  0% { 
    transform: scaleX(1) scaleY(1);
    filter: brightness(1);
  }
  15% { 
    transform: scaleX(1.06) scaleY(1.15);
    filter: brightness(1.5) drop-shadow(0 0 6px rgba(247,129,102,0.5));
  }
  30% { 
    transform: scaleX(0.3) scaleY(1.1);
    filter: brightness(1.8) drop-shadow(0 0 10px rgba(247,129,102,0.4));
  }
  50% { 
    transform: scaleX(0.3) scaleY(1.1);
    filter: brightness(1.2);
  }
  70% { 
    transform: scaleX(1.04) scaleY(1);
    filter: brightness(1.3) drop-shadow(0 0 4px rgba(247,129,102,0.3));
  }
  100% { 
    transform: scaleX(1) scaleY(1);
    filter: brightness(1);
  }
}
.hexagram-column:first-child .yao-changing {
  animation: yaoMorph 1s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.hexagram-column:first-child .yao-changing .yao-mark svg circle,
.hexagram-column:first-child .yao-changing .yao-mark svg line {
  animation: inherit;
}
.hexagram-column:first-child .yao-changing .yao-change-label {
  animation: none;
}
.hexagram-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.hexagram-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 12px;
  border-radius: 0;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: 1px solid;
}
.badge-primary { border-color: rgba(201,169,110,0.15); color: #f78166; background: rgba(201,169,110,0.03); }
.badge-secondary { border-color: rgba(90,74,58,0.2); color: #8b949e; background: rgba(90,74,58,0.04); }
.badge-changing { border-color: rgba(192,57,43,0.15); color: #f78166; background: rgba(192,57,43,0.03); }
.hexagram-title {
  font-size: 1.25rem;
  font-weight: 500;
  color: #f78166;
  letter-spacing: 2px;
}
.hexagram-subtitle {
  font-size: 0.8rem;
  color: #8b949e;
  letter-spacing: 1px;
}

/* ===== HEXAGRAM DISPLAY ===== */
.hexagram-art {
  flex-shrink: 0;
  padding: 12px 16px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px solid #161b22;
  min-width: 110px;
}
.hexagram-art .yao-row {
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 2;
  white-space: nowrap;
  height: 32px;
}
.hexagram-art .visual-yao {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 106px;
}
.hexagram-art .yao-bar {
  display: flex;
  align-items: center;
}
.hexagram-art .yao-solid {
  width: 80px;
  height: 8px;
  background: #f78166;
  border-radius: 2px;
}
.hexagram-art .yao-broken {
  gap: 20px;
}
.hexagram-art .yao-broken span {
  display: block;
  width: 30px;
  height: 8px;
  background: #f78166;
  border-radius: 2px;
}
.hexagram-art .yao-changing .yao-solid,
.hexagram-art .yao-changing .yao-broken span {
  background: #f78166;
}
.hexagram-art .yao-change-label {
  font-size: 0.6rem;
  color: #f78166;
  opacity: 0.7;
  margin-left: 2px;
}
.hexagram-art .yao-line {
  font-size: 1.25rem;
  letter-spacing: 3px;
  color: #e6edf3;
}
.hexagram-art .yao-pos {
  font-size: 0.65rem;
  color: #6e7681;
  min-width: 20px;
  font-variant-numeric: tabular-nums;
}
.hexagram-art .yao-changing .yao-line { color: #f78166; }
.hexagram-art .yao-changing .yao-pos { color: #f78166; }

.hexagram-info {
  flex: 1;
  min-width: 200px;
}
.hexagram-info .info-block {
  margin-bottom: 14px;
}
.hexagram-info .info-label {
  font-size: 0.8rem;
  color: #8b949e;
  letter-spacing: 1px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.hexagram-info .info-content {
  font-size: 0.9rem;
  color: #e6edf3;
  padding: 8px 14px;
  background: rgba(0,0,0,0.12);
  border-radius: 3px;
  border-left: 2px solid #30363d;
  line-height: 1.7;
}
.hexagram-info .info-content.tuan {
  border-left-color: #da3633;
  color: #f0f6fc;
  font-weight: 500;
}
.hexagram-info .info-content.judgment {
  border-left-color: #6e7681;
}
.hexagram-info .info-content.desc {
  border-left-color: #30363d;
  background: rgba(58,74,58,0.03);
}

/* Changing arrow */
.changing-arrow {
  text-align: center;
  padding: 4px 0;
  font-size: 0.9rem;
  color: #f78166;
  letter-spacing: 2px;
  opacity: 0.65;
}
@keyframes pulseArrow {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(3px); opacity: 0.8; }
}

/* ===== YAO DETAILS ===== */
/* ===== LLM SECTION ===== */
.llm-section {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 20px;
  margin-top: 20px;
}
.llm-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.llm-header h3 { font-size: 0.85rem; color: #f78166; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
.llm-loading {
  display: none;
  align-items: center;
  gap: 10px;
  color: #8b949e;
  font-size: 0.9rem;
}
.llm-loading.active { display: flex; }
.llm-spinner {
  width: 20px; height: 20px;
  border: 2px solid #30363d;
  border-top-color: #a03020;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.llm-content {
  display: none;
  padding: 14px 18px;
  background: rgba(0,0,0,0.15);
  border-radius: 10px;
  line-height: 1.9;
  font-size: 0.95rem;
}
.llm-content.active { display: block; }
.llm-content p { margin-bottom: 10px; }
.llm-content p:last-child { margin-bottom: 0; }
.llm-content strong { color: #f78166; }
.llm-content h3 {
  font-size: 1rem;
  color: #f78166;
  margin: 16px 0 8px;
  letter-spacing: 1px;
}
.llm-content h3:first-child { margin-top: 0; }
.llm-content ul {
  list-style: none;
  padding: 0;
  margin: 8px 0;
}
.llm-content li {
  padding: 4px 0 4px 18px;
  position: relative;
  font-size: 0.9rem;
  color: #e6edf3;
  line-height: 1.7;
}
.llm-content li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 14px;
  width: 6px;
  height: 6px;
  background: #f78166;
  border-radius: 1px;
}
.llm-content blockquote {
  margin: 10px 0;
  padding: 8px 14px;
  border-left: 2px solid #f78166;
  background: rgba(247,129,102,0.04);

}
.llm-content code {

  color: #f78166;
}

/* LLM Chat */
.llm-chat {
  margin-top: 14px;
}
.llm-chat-input-row {
  display: flex;
  gap: 8px;
}
.llm-chat-input {
  flex: 1;
  font-family: inherit;
  padding: 10px 14px;
  font-size: 0.9rem;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #e6edf3;
  outline: none;
  transition: border-color 0.2s;
}
.llm-chat-input:focus {
  border-color: #f78166;
}
.llm-chat-btn {
  font-family: inherit;
  padding: 10px 18px;
  font-size: 0.85rem;
  background: linear-gradient(135deg, #21262d, #da3633);
  color: #f0f6fc;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: 1px;
  transition: opacity 0.2s;
}
.llm-chat-btn:hover { opacity: 0.85; }
.llm-chat-btn:disabled { opacity: 0.4; cursor: default; }
.retry-link {
  color: #f78166;
  text-decoration: underline;
  cursor: pointer;
  transition: opacity 0.2s;
}
.retry-link:hover { opacity: 0.75; }
.llm-chat-msg {
  padding: 10px 14px;
  margin-bottom: 8px;
  border-radius: 8px;
  font-size: 0.85rem;
  line-height: 1.7;
  animation: fadeInUp 0.2s ease;
}
.llm-chat-msg.user {
  background: rgba(247,129,102,0.08);
  border: 1px solid rgba(247,129,102,0.12);
  color: #e6edf3;
}
.llm-chat-msg.assistant {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  color: #d0d8e0;
}
.llm-chat-msg.typing {
  color: #8b949e;
  font-style: italic;
}

.llm-error {
  display: none;
  padding: 12px 16px;
  background: rgba(192,57,43,0.04);
  border-radius: 6px;
  border-left: 2px solid #da3633;
  font-size: 0.85rem;
  color: #8b949e;
  line-height: 1.6;
}
.llm-error.active { display: block; }
.llm-error code {
  background: #0d1117;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.8rem;
  color: #f78166;
}

/* ===== STATIC CARD ===== */
.static-card {
  text-align: center;
  padding: 10px 14px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px solid #161b22;
  font-size: 0.8rem;
  color: #6e7681;
  margin-top: 16px;
  letter-spacing: 1px;
}

/* ===== HISTORY ===== */
.history-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  padding: 8px;
  background: transparent;
  border: none;
  font-size: 0.8rem;
  color: #6e7681;
  letter-spacing: 1px;
}
.history-bar span { color: #8b949e; }

/* ===== REFERENCE ===== */
.ref-section {
  margin-top: 20px;
  border-top: 1px solid #161b22;
  padding-top: 16px;
}
.ref-toggle {
  background: none;
  border: 1px solid #30363d;
  padding: 6px 14px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 0.8rem;
  color: #6e7681;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  letter-spacing: 1px;
}
.ref-toggle:hover { background: #161b22; color: #e6edf3; border-color: #6e7681; }
.ref-grid {
  display: none;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 12px;
}
.ref-grid.open { display: grid; }
@media (max-width: 600px) {
  .ref-grid { grid-template-columns: repeat(2, 1fr); }
}
.ref-item {
  padding: 5px 8px;
  background: #0d1117;

  text-align: center;
  font-size: 0.8rem;

}
.ref-item .ref-sym { font-size: 1.1rem; display: block; opacity: 0.7; }

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 28px 0 12px;
  color: #30363d;
  font-size: 0.7rem;
  letter-spacing: 2px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .main-content { padding: 8px 8px 40px; }

  .header h1 { font-size: 1.3rem; letter-spacing: 4px; }
  .header .subtitle { font-size: 0.72rem; }
  .header::after { margin: 12px auto 0; width: 40px; }
  .hexagram-columns { flex-direction: column; }

  .btn-cast { padding: 12px 16px; font-size: 0.85rem; letter-spacing: 3px; }
  .settings-panel.open { padding: 16px; }
  .controls { gap: 8px; margin: 16px 0 12px; }
  .controls .btn { flex: 1; min-width: 0; padding: 12px 4px; font-size: 0.8rem; letter-spacing: 1px; border-radius: 6px; }
  .sidebar-toggle, .btn-theme-toggle { width: 40px; height: 40px; font-size: 1.1rem; }
  .btn-theme-toggle { top: 8px; right: 6px; }
  .sidebar-toggle { top: 8px; left: 6px; }
  .step-modal { padding: 20px 16px; max-width: 100%; width: 94%; border-radius: 10px; }
  .step-prompt { font-size: 0.9rem; }
  .step-result { font-size: 0.85rem; padding: 12px; }
  .coins-row { gap: 10px; }
  .coin-btn { width: 80px; height: 80px; font-size: 0.85rem; }
  .input-row input { width: 60px; height: 40px; font-size: 0.9rem; }
  .hexagram-column .hexagram-art { gap: 2px; }
  .yao-bar { width: 80px !important; }
  .visual-yao { min-width: 80px; }
  .changing-arrow { font-size: 0.8rem; padding: 8px; }
  .static-card { font-size: 0.82rem; padding: 10px 12px; }

  .llm-content { font-size: 0.82rem; padding: 12px; }
  .history-bar { font-size: 0.78rem; padding: 8px 12px; }
  .toss-animation { width: 100px; height: 100px; font-size: 2.5rem; }
}

@media (max-width: 480px) {
  .controls { gap: 6px; }
  .controls .btn { padding: 10px 2px; font-size: 0.7rem; letter-spacing: 0; }
  .sidebar-header { padding: 12px 10px 8px; }
  .sidebar-header h2 { font-size: 0.78rem; }
  .sidebar-item { padding: 8px 10px; }
  .step-modal { padding: 16px 12px; }
  .coin-btn { width: 66px; height: 66px; font-size: 0.78rem; }
  .input-row input { width: 50px; height: 36px; font-size: 0.82rem; }
  .yao-bar { width: 60px !important; }

}

<body>

<div class="app-wrapper">

  <!-- SIDEBAR TOGGLE (mobile) -->
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar open" id="sidebar">
    <div class="sidebar-header">
      <h2>占卜记录</h2>
      <p>共 <span id="historyCount">0</span> 次</p>
      <button class="sidebar-collapse-btn" onclick="toggleSidebar()" title="收起侧栏">◀</button>
    </div>
    <div class="sidebar-list" id="historyList">
      <div class="empty-history" id="emptyHistory">
        <span class="empty-icon">☯</span>
        尚无占卜记录<br>点击「摇卦」开始
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-clear-btn" id="clearHistoryBtn" onclick="clearHistory()">✖ 清空记录</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- THEME TOGGLE (右上角) -->
    <button class="btn btn-theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">
      <span id="themeIcon">☽</span>
    </button>

    <!-- HEADER -->
    <header class="header">
      <h1>六爻占卜</h1>
      <p class="subtitle">易有太极，是生两仪，两仪生四象，四象生八卦</p>
    </header>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn btn-cast" onclick="startManualCast()">手 摇（推荐）</button>
    <button class="btn btn-method" onclick="startBookCast()">书 页</button>
    <button class="btn btn-method" onclick="startCardCast()">扑 克</button>
    <button class="btn btn-method" id="btnCast" onclick="castHexagram()">随 机</button>
  </div>
  <div class="controls-sub">
    <button class="btn btn-settings-toggle" onclick="toggleSettings()">
      ⚙ 接入 LLM
    </button>
  </div>

  <!-- SETTINGS -->
  <div class="settings-panel" id="settingsPanel">
    <h3>LLM 智能解读设置</h3>
    <div class="settings-grid">
      <div>
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." value="">
      </div>
      <div>
        <label>API Base URL</label>
        <input type="text" id="apiBase" value="https://api.deepseek.com">
      </div>
      <div>
        <label>模型名称</label>
        <input type="text" id="modelName" value="deepseek-chat">
      </div>
      <div>
        <label>启用 LLM 解读</label>
        <select id="enableLLM">
          <option value="1">启用</option>
          <option value="0">仅传统卦辞</option>
        </select>
      </div>
    </div>
  </div>

  <!-- RESULT AREA -->
  <div id="resultArea"></div>

  <!-- HISTORY -->
  <div class="history-bar" id="historyBar">
    本局已摇卦 <span id="castCount">0</span> 次
  </div>

  <!-- REFERENCE -->
  <div class="ref-section">
    <button class="ref-toggle" onclick="toggleRef()">≡ 八卦参考</button>
    <div class="ref-grid" id="refGrid"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">心诚则灵 · 仅供娱乐参考</div>
</div> <!-- /main-content -->
</div> <!-- /app-wrapper -->

<!-- TOSS OVERLAY (随机起卦) -->
<div class="toss-overlay" id="tossOverlay">
  <div class="toss-animation">
    <div class="coin-spinner">☰</div>
    <div class="toss-text">起卦中…</div>
  </div>
</div>

<!-- STEP OVERLAY (手摇 / 扑克牌) -->
<div class="step-overlay" id="stepOverlay">
  <div class="step-modal">
    <div class="step-modal-header">
      <span class="step-modal-title" id="stepMethodName">手摇起卦</span>
      <button class="step-close-btn" onclick="hideStepOverlay()">✕</button>
    </div>
    <div class="step-counter" id="stepCounter">
      <span id="stepPosName">初</span>爻 · <span id="stepCount">1 / 6</span>
    </div>
    <div class="step-progress-track" id="stepProgressTrack">
      <div class="step-progress-fill" id="stepProgressFill"></div>
    </div>
    <div class="step-body">
      <div class="step-prompt" id="stepPrompt">请将三枚铜钱握于手中，摇晃后掷出</div>
      <div class="step-coins" id="stepCoins">
        <!-- 手摇：3枚硬币 -->
        <div class="coins-row" id="coinRow">
          <button class="coin-btn" data-idx="0" onclick="toggleCoin(0)">
            <span class="coin-face" id="coinFace0">背</span>
          </button>
          <button class="coin-btn" data-idx="1" onclick="toggleCoin(1)">
            <span class="coin-face" id="coinFace1">背</span>
          </button>
          <button class="coin-btn" data-idx="2" onclick="toggleCoin(2)">
            <span class="coin-face" id="coinFace2">背</span>
          </button>
        </div>
        <!-- 书页：3个数字输入 -->
        <div class="input-row" id="bookInputRow" style="display:none">
          <input type="number" class="step-input" id="bookInput0" min="1" placeholder="如 23">
          <input type="number" class="step-input" id="bookInput1" min="1" placeholder="如 87">
          <input type="number" class="step-input" id="bookInput2" min="1" placeholder="如 45">
        </div>
        <!-- 扑克：3个字符输入 -->
        <div class="input-row" id="cardInputRow" style="display:none">
          <input type="text" class="step-input card-input" id="cardInput0" maxlength="2" placeholder="A">
          <input type="text" class="step-input card-input" id="cardInput1" maxlength="2" placeholder="K">
          <input type="text" class="step-input card-input" id="cardInput2" maxlength="2" placeholder="Q">
        </div>
        <div class="coin-hint" id="coinHint">点击硬币切换正反面</div>
        <button class="btn coin-confirm-btn" id="coinConfirmBtn" onclick="confirmCoinCast()">确 认</button>
      </div>
      <div class="step-result" id="stepResultArea">
        <div class="step-result-line" id="stepResultLine">———</div>
        <div class="step-result-desc" id="stepResultDesc"></div>
      </div>
    </div>
    <button class="btn step-btn" id="stepActionBtn">抽 牌</button>
  </div>
</div>


<script src="app.js"></script>
</body>
</html>
